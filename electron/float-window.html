<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日程悬浮窗</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }

    #app {
      width: 100%;
      height: 100vh;
      padding: 8px;
      background: rgba(255, 255, 255, 0.85);
      border-radius: 8px;
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 8px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
    }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
    }

    .time {
      font-size: 11px;
      color: #666;
    }

    .event-list {
      max-height: calc(100vh - 50px);
      overflow-y: auto;
    }

    .event-item {
      padding: 6px 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 4px;
      border-left: 3px solid #4CAF50;
      transition: all 0.2s;
    }

    .event-item:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    .event-item.urgent {
      border-left-color: #f44336;
    }

    .event-item.today {
      border-left-color: #2196F3;
    }

    .event-title {
      font-size: 12px;
      font-weight: 500;
      color: #1a1a1a;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-time {
      font-size: 10px;
      color: #666;
    }

    .no-events {
      text-align: center;
      padding: 20px 10px;
      font-size: 12px;
      color: #999;
    }

    /* 滚动条样式 */
    .event-list::-webkit-scrollbar {
      width: 4px;
    }

    .event-list::-webkit-scrollbar-track {
      background: transparent;
    }

    .event-list::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2px;
    }

    .event-list::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="header">
      <span class="title">📅 24 小时日程</span>
      <span class="time" id="currentTime"></span>
    </div>
    <div class="event-list" id="eventList">
      <div class="no-events">加载中...</div>
    </div>
  </div>

  <script>
    const backendUrl = 'http://127.0.0.1:5000';
    let opacity = 0.85;

    // 格式化时间
    function formatTime(date) {
      const hours = date.getHours().toString().padStart(2, '0');
      const minutes = date.getMinutes().toString().padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // 格式化日期范围
    function formatDateTimeRange(startTime, endTime) {
      const start = new Date(startTime);
      const end = new Date(endTime);
      const startStr = formatTime(start);
      const endStr = formatTime(end);
      return `${startStr} - ${endStr}`;
    }

    // 判断是否紧急（2 小时内）
    function isUrgent(startTime) {
      const now = new Date();
      const start = new Date(startTime);
      const diff = start - now;
      return diff > 0 && diff < 2 * 60 * 60 * 1000;
    }

    // 判断是否是今天的日程
    function isToday(startTime) {
      const now = new Date();
      const start = new Date(startTime);
      return now.toDateString() === start.toDateString();
    }

    // 加载日程
    async function loadEvents() {
      try {
        const now = new Date();
        const tomorrow = new Date(now.getTime() + 24 * 60 * 60 * 1000);
        
        // 使用后端 API 的日期范围查询
        const startDate = now.toISOString().split('T')[0];
        const endDate = tomorrow.toISOString().split('T')[0];
        
        const response = await fetch(`${backendUrl}/api/entries/range?start_date=${startDate}&end_date=${endDate}`);
        if (!response.ok) {
          throw new Error('Failed to fetch events');
        }
        
        const data = await response.json();
        renderEvents(data.entries || []);
      } catch (error) {
        console.error('Error loading events:', error);
        document.getElementById('eventList').innerHTML = 
          '<div class="no-events">加载失败</div>';
      }
    }

    // 渲染日程列表
    function renderEvents(events) {
      const eventList = document.getElementById('eventList');
      
      if (!events || events.length === 0) {
        eventList.innerHTML = '<div class="no-events">暂无日程</div>';
        return;
      }

      eventList.innerHTML = events.map(event => {
        const timeRange = formatDateTimeRange(event.start_time, event.end_time);
        const urgentClass = isUrgent(event.start_time) ? 'urgent' : '';
        const todayClass = isToday(event.start_time) && !urgentClass ? 'today' : '';
        
        return `
          <div class="event-item ${urgentClass} ${todayClass}">
            <div class="event-title">${event.title}</div>
            <div class="event-time">${timeRange}</div>
          </div>
        `;
      }).join('');
    }

    // 更新时间显示
    function updateTime() {
      const now = new Date();
      document.getElementById('currentTime').textContent = formatTime(now);
    }

    // 初始化
    function init() {
      updateTime();
      loadEvents();
      
      // 每分钟更新时间和日程
      setInterval(() => {
        updateTime();
        loadEvents();
      }, 60 * 1000);
    }

    // 监听 IPC 消息
    if (typeof require !== 'undefined') {
      const { ipcRenderer } = require('electron');
      
      ipcRenderer.on('update-opacity', (event, newOpacity) => {
        opacity = newOpacity;
        document.getElementById('app').style.background = `rgba(255, 255, 255, ${opacity})`;
      });
    }

    init();
  </script>
</body>
</html>
